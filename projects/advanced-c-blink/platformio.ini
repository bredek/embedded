; Лаба 11: Embedded C++ blink (ESP32-S3 DevKitC-1, N16R8)
; LED + 220 Ом на GPIO21, кнопка GPIO16 -> GND (INPUT_PULLUP)
; Залити і відкрити Serial Monitor: pio run -t upload -t monitor

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; модуль N16R8: 16 МБ flash, 8 МБ PSRAM
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags = -Wall -Wextra
; Якщо Serial Monitor мовчить через роз'єм "USB" (не "UART"/"COM"), заміни рядок вище на:
; build_flags = -Wall -Wextra -D ARDUINO_USB_CDC_ON_BOOT=1
