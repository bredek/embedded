; Лаба 9 v2: тренер кроків для кишені. ESP32-S3 DevKitC-1 (N16R8) + ADXL345 + OLED SSD1306 + 2 кнопки (без зумера)
; Три програми в одному проєкті. Обери потрібну внизу VS Code (кнопка "env:...") або:
;   pio run -e step0 -t upload      перевірка заліза (I2C-сканер, ADXL345, кнопки)
;   pio run -e step1 -t upload      крок 1: лічильник кроків + OLED
;   pio run -e step2 -t upload      крок 2: ціль, темп, час, заряд (повна версія)

[platformio]
default_envs = step2

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; модуль N16R8: 16 МБ flash, 8 МБ PSRAM (як у твоєму wifi-weather)
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; Якщо кабель у порті "USB" (а не "COM"/"UART") і Serial Monitor мовчить,
; прибери ; на наступному рядку:
; build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:step0]
build_src_filter = +<step0_hw_test.cpp>

[env:step1]
build_src_filter = +<step1_counter.cpp>

[env:step2]
build_src_filter = +<step2_trainer.cpp>

; ---- ESP32-C3 Super Mini (одна шина I2C, піни в include/pins.h під BOARD_C3)
[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; C3 без PSRAM: перевизначаємо S3-налаштування з [env]
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags =
    -DBOARD_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

[env:c3_step0]
extends = env:c3
build_src_filter = +<step0_hw_test.cpp>

[env:c3_step1]
extends = env:c3
build_src_filter = +<step1_counter.cpp>

[env:c3_step2]
extends = env:c3
build_src_filter = +<step2_trainer.cpp>
